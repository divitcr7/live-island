<title>Live Island Designs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Figtree:wght@400..700&family=Martian+Mono:wght@300..600&display=swap">
<style>
/* Layout: a plain spec sheet. Choices on the left; on the right a full phone you can drive, then every island state shown inside a real phone top (bezel, status bar, camera, app underneath). Flat. No glow. */
:root{
  --bg:#EEEDEA; --surface:#F7F6F3; --line:#D9D7D2; --fg:#1B1B1D; --muted:#6C6A70; --dim:#9A989E; --inv:#F7F6F3;
  --page:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --pmono:"Geist Mono",ui-monospace,Menlo,monospace;
  /* island choices */
  --c-music:#B4A3DB; --c-timer:#DDA24E; --c-nav:#86AECF; --c-call:#73BF95; --c-alert:#DE6B55; --c-neutral:#E9E7E2;
  --f-ui:"Geist",ui-sans-serif,system-ui,sans-serif; --f-num:"Geist Mono",ui-monospace,Menlo,monospace; --num-track:-.01em;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--surface:#18181B;--line:#2A2A2E;--fg:#E9E7E2;--muted:#929097;--dim:#646268;--inv:#111113;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111113;--surface:#18181B;--line:#2A2A2E;--fg:#E9E7E2;--muted:#929097;--dim:#646268;--inv:#111113;color-scheme:dark}

:root[data-pal="signal"]{--c-music:#E9E7E2;--c-timer:#E9E7E2;--c-nav:#E9E7E2;--c-call:#F2603C;--c-alert:#F2603C}
:root[data-pal="mono"]{--c-music:#E9E7E2;--c-timer:#E9E7E2;--c-nav:#E9E7E2;--c-call:#E9E7E2;--c-alert:#E9E7E2}
:root[data-pal="adaptive"]{--c-music:#E48D6A;--c-timer:#D9B45C;--c-nav:#6FB59B;--c-call:#7FBF7A;--c-alert:#DE6B55}
:root[data-pal="clay"]{--c-music:#C99B95;--c-timer:#CDAE74;--c-nav:#97AE9F;--c-call:#A1B893;--c-alert:#C97E68;--c-neutral:#E2DCD1}
:root[data-type="rounded"]{--f-ui:"Figtree",ui-rounded,system-ui,sans-serif;--f-num:"Figtree",ui-rounded,system-ui,sans-serif;--num-track:0}
:root[data-type="mono"]{--f-ui:"Martian Mono",ui-monospace,Menlo,monospace;--f-num:"Martian Mono",ui-monospace,Menlo,monospace;--num-track:-.03em}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--page);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.lab-k{font-family:var(--pmono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

header{padding-block:28px 20px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 16px;font-size:15px;font-weight:500;cursor:pointer}
.tab:hover{border-color:var(--dim)}
.tab[aria-current="true"]{background:var(--fg);color:var(--inv);border-color:var(--fg)}
.theme{padding-block:28px 28px;display:grid;gap:8px;max-width:760px}
.theme h1{font-size:44px;letter-spacing:-.03em;line-height:1}
.theme p{margin:0;color:var(--muted);font-size:16px;max-width:60ch}
.spec{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.spec span{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.spec span b{color:var(--fg);font-weight:500}

.lab{padding-bottom:64px}
.ctl{display:grid;position:sticky;top:max(16px,env(safe-area-inset-top,0px))}
.ax{padding-block:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.ax h2{font-size:13.5px;font-weight:600;letter-spacing:0}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.opt:hover{border-color:var(--dim)}
.opt[aria-pressed="true"]{background:var(--fg);color:var(--inv);border-color:var(--fg)}
.opt .d{display:flex;gap:2px}.opt .d i{width:8px;height:8px;border-radius:2px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.note{color:var(--muted);font-size:12.5px;margin:0;line-height:1.4}
.summary{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.summary pre{margin:0;font-family:var(--pmono);font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.brow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--fg);border-radius:8px;padding:7px 12px;background:var(--fg);color:var(--inv);font-weight:500;font-size:13px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.copied{font-family:var(--pmono);font-size:11.5px;color:var(--muted)}

.main{display:grid;gap:40px;min-width:0}
.live{display:grid;grid-template-columns:auto minmax(0,320px);gap:48px;align-items:start;justify-content:start}
.states{display:grid;gap:6px;align-content:start}
.states .opt{justify-content:space-between;width:100%;border-radius:8px;padding:8px 12px}
.states .opt small{font-family:var(--pmono);font-size:11px;opacity:.6}
.ctxrow{display:grid;gap:8px;margin-top:14px}

/* phone hardware */
.ph{width:408px;padding:8px;border-radius:48px;background:#1C1C1E;box-shadow:0 0 0 1px #2C2C2E}
.ph.full .scr{height:820px}
.scr{position:relative;width:392px;border-radius:40px;overflow:hidden;background:var(--app-bg)}
.fit{width:100%;overflow:hidden}
.fit>.ph,.fit>.crop{transform-origin:top left}
.crop{width:408px;padding:8px 8px 0;border-radius:48px 48px 0 0;background:#1C1C1E;overflow:hidden}
.crop .scr{border-radius:40px 40px 0 0}

/* screen contexts */
.scr{--app-bg:#FFFFFF;--app-fg:#151517;--app-mut:#7B7A80;--app-line:#EDEDEF;--app-av:#E6E5E1}
.ctx-dark .scr,.scr.ctx-dark{--app-bg:#0E0E10;--app-fg:#ECEBE7;--app-mut:#86858B;--app-line:#1F1F22;--app-av:#26262A}
.ctx-home .scr,.scr.ctx-home{--app-bg:#59645D;--app-fg:#F4F2EC;--app-mut:rgba(244,242,236,.7)}
.sbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;color:var(--app-fg);font-family:var(--page);font-size:14px;font-weight:600;z-index:1}
.sbar .ico{display:flex;gap:6px;align-items:center}
.cam{position:absolute;left:50%;top:16px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#050506;box-shadow:inset 0 0 0 2px #121214;z-index:9;pointer-events:none}
.cam::after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;background:#2a3348;top:3px;left:3px}
.app{position:absolute;top:44px;left:0;right:0;bottom:0;color:var(--app-fg);font-family:var(--page)}
.app-h{display:flex;justify-content:space-between;align-items:baseline;padding:22px 22px 10px}
.app-h b{font-size:28px;font-weight:600;letter-spacing:-.02em}
.app-h span{color:var(--app-mut);font-size:14px}
.srch{margin:4px 18px 10px;height:38px;border-radius:12px;background:var(--app-line);display:flex;align-items:center;padding:0 12px;color:var(--app-mut);font-size:14px}
.msg{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:11px 22px;align-items:center}
.msg .a{width:44px;height:44px;border-radius:50%;background:var(--app-av);display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--app-mut)}
.msg b{font-size:15px;font-weight:600;display:block}
.msg p{margin:0;color:var(--app-mut);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg time{color:var(--app-mut);font-size:12px;align-self:start;margin-top:3px}
.home{padding:70px 26px 0}
.home .day{font-size:15px;opacity:.8}
.home .big{font-size:64px;font-weight:300;letter-spacing:-.04em;line-height:1}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 18px;margin-top:300px}
.grid4 i{aspect-ratio:1;border-radius:18px;background:rgba(244,242,236,.16);display:block}
.ctx-home .app-h,.ctx-home .srch,.ctx-home .msg{display:none}
.scr:not(.ctx-home) .home{display:none}

.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:28px 22px}
.tile{display:grid;gap:10px;margin:0;min-width:0;align-content:start}
.tile figcaption{display:grid;gap:2px}
.tile figcaption b{font-size:13.5px;font-weight:600}
.tile figcaption span{color:var(--muted);font-size:12.5px}

/* ---------- island ---------- */
.isl{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#000;font-family:var(--f-ui);color:#EEECE7;z-index:5}
.hi{position:absolute;top:6px;left:50%;z-index:5}
.hi .isl{top:0;left:0;transform:none}
:root[data-body="hairline"] .isl{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
:root[data-body="hairline"] .ctx-light .isl,:root[data-body="hairline"] .scr.ctx-light .isl{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
:root[data-body="tint"] .isl{background:color-mix(in srgb,var(--aura) 15%,#060607)}
.vw{position:absolute;inset:0;overflow:hidden;border-radius:inherit}
.fillbar{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--aura) 22%,transparent);display:none}
:root[data-rim="fill"] .fillbar{display:block}
.ubar{position:absolute;left:16px;right:16px;bottom:5px;height:2px;border-radius:1px;background:rgba(255,255,255,.12);display:none;overflow:hidden}
.ubar i{display:block;height:100%;background:var(--aura)}
:root[data-rim="under"] .ubar{display:block}
.rim{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:3}
.rim path{fill:none;display:none}
.rim .g{stroke:var(--aura);stroke-width:1.5;stroke-linecap:round}
.rim .t0{stroke:rgba(255,255,255,.14);stroke-width:2.6;stroke-dasharray:.22 1.78}
.rim .t1{stroke:var(--aura);stroke-width:2.6;stroke-dasharray:.22 1.78}
.rim .mk{stroke:#fff;stroke-width:10;display:block}
:root[data-rim="line"] .rim .g{display:block}
:root[data-rim="ticks"] .rim .t0,:root[data-rim="ticks"] .rim .t1{display:block}

.view{position:absolute;top:0;left:50%;transform:translateX(-50%) scale(.97);opacity:0;transition:opacity var(--vt,.22s) ease,transform .3s ease}
.view.on{opacity:1;transform:translateX(-50%) scale(1);transition-delay:.06s}
:root[data-motion="liquid"]{--vt:.45s}
:root[data-motion="snappy"]{--vt:.12s}

.v{font-size:13px;line-height:1.25;position:relative}
.split{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 11px;gap:26px}
.split>div{display:flex;align-items:center;gap:7px;min-width:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:var(--num-track);font-weight:500}
:root[data-type="mono"] .v{font-size:11.5px}
.mut{color:#8E8D93}
.ic{flex:none;display:block}
.tkw{height:32px;overflow:hidden}
.tk{display:flex;flex-direction:column;transform:translateY(calc(var(--ti,0) * -32px));transition:transform .6s cubic-bezier(.5,0,.15,1)}
.tk>span{height:32px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.cambar{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-family:var(--f-num);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7E7D83}
.cambar span{display:flex;align-items:center;gap:5px}
.pad{padding:0 16px 14px;display:grid;gap:10px}
.art{width:20px;height:20px;border-radius:5px;flex:none;background:#B9876F;background-image:linear-gradient(160deg,#C79A7F 0 45%,#6F5A86 45% 100%)}
.art.lg{width:48px;height:48px;border-radius:10px}
.wave{display:flex;align-items:center;gap:2px;height:14px}
.wave i{width:2px;border-radius:1px;background:var(--aura);height:30%;animation:wv 1s ease-in-out infinite alternate}
@keyframes wv{0%{height:25%}100%{height:100%}}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.meta{display:grid;min-width:0;flex:1}
.meta b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{color:#8E8D93;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root[data-type="mono"] .meta b{font-size:12.5px}:root[data-type="mono"] .meta small{font-size:11px}
.scrub{position:relative;height:3px;border-radius:2px;background:rgba(255,255,255,.14);margin-top:4px}
.scrub i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#EEECE7}
.times{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:10.5px;color:#7E7D83;margin-top:-4px}
.ctrls{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#E3E1DC}
.ib.big{width:44px;height:44px;background:#EEECE7;color:#000}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:14px;color:#1b1b1d;background:#D8D2C4}
.cbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#0b0b0c;flex:none}
.cbtn.no{background:var(--c-alert)}.cbtn.no svg{transform:rotate(135deg)}
.cbtn.yes{background:var(--c-call)}
:root[data-pal="signal"] .cbtn.yes{background:#E9E7E2}
:root[data-shape="tight"] .art.lg{border-radius:6px}
:root[data-shape="tight"] .ib.big,:root[data-shape="tight"] .cbtn{border-radius:11px}
.chg{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 16px}
.chg .pct{font-family:var(--f-num);font-size:22px;font-weight:500;letter-spacing:-.03em;color:var(--aura)}

footer{padding-block:24px 48px;border-top:1px solid var(--line);color:var(--muted);font-family:var(--pmono);font-size:11.5px}

@media (max-width:860px){ .live{grid-template-columns:minmax(0,1fr)} .states{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))} .theme h1{font-size:34px} }
@media (max-width:860px){ .lab{grid-template-columns:minmax(0,1fr)} .ctl{position:static} }
@media (prefers-reduced-motion:reduce){ .wave i{animation:none;height:60%} .view,.tk{transition:none} }
</style>

<div class="wrap">
  <header>
    <span class="lab-k">Live Island · designs</span>
    <nav class="tabs" id="tabs" aria-label="Designs"></nav>
  </header>
  <div class="theme">
    <h1 id="tName"></h1>
    <p id="tDesc"></p>
    <div class="spec" id="tSpec"></div>
  </div>
  <div class="lab">
    <div class="main">
      <div class="live">
        <div class="fit" id="fitLive" data-w="408"><div class="ph full"><div class="scr" id="liveScr">
          <div class="sbar"></div><div class="app"></div>
          <div class="hi" id="hi"></div><div class="cam"></div>
        </div></div></div>
        <div>
          <span class="lab-k">Show on the phone</span>
          <div class="states" id="states" style="margin-top:8px"></div>
          <div class="ctxrow"><span class="lab-k">Screen behind it</span><div class="opts" id="ctxopts"></div></div>
        </div>
      </div>

      <div>
        <div style="display:grid;gap:4px;margin-bottom:16px"><span class="lab-k">Every state in this design</span></div>
        <div class="sheet" id="sheet"></div>
      </div>
    </div>
  </div>
</div>
<footer><div class="wrap">Live Island designs · browser mock-up of the Android app</div></footer>

<script>
(() => {
const I={
 pause:'<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/>',
 prev:'<path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/>',next:'<path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor"/>',
 turn:'<path d="M6 20v-7a4 4 0 0 1 4-4h8M14 5l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z" fill="currentColor"/>',
 bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/>',
 hourglass:'<path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
 bt:'<path d="M7 7l10 10-5 4V3l5 4L7 17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>',
 heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="none" stroke="currentColor" stroke-width="1.8"/>',
 cal:'<rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16M9 3v4M15 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
 batt:'<rect x="3" y="7" width="16" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="5.5" y="9.5" width="9" height="5" rx="1.2" fill="currentColor"/><path d="M21 10.5v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
 cloud:'<path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
};
const ic=(n,s=16,st='')=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true" style="${st}">${I[n]}</svg>`;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const root=document.documentElement;

/* ---------- decisions ---------- */
const AX=[
 {k:'pal',name:'Colour',opts:[
   ['signal','Signal','Off-white for everything. One orange, used only for calls and alarms.',['#E9E7E2','#E9E7E2','#F2603C']],
   ['mono','Mono','No colour at all. Everything is off-white.',['#E9E7E2','#BDBBB6','#8E8D93']],
   ['coded','Coded','Each activity gets a muted colour of its own: music, timer, maps, calls.',['#B4A3DB','#DDA24E','#86AECF','#73BF95']],
   ['adaptive','Adaptive','The colour comes from the album art or the app icon.',['#E48D6A','#D9B45C','#6FB59B']],
   ['clay','Clay','Dusty earth tones.',['#C99B95','#CDAE74','#97AE9F']]]},
 {k:'rim',name:'Progress',opts:[
   ['line','Edge line','A 1.5px line runs around the edge as progress grows.'],
   ['ticks','Ticks','Tick marks around the edge, like a watch dial, light up one by one.'],
   ['under','Underline','A short bar along the bottom inside. The most conventional option.'],
   ['fill','Fill','The background fills from left to right.'],
   ['off','None','No progress on the island itself.']]},
 {k:'shape',name:'Corners when open',opts:[['round','Round','Very soft, 36px corners.'],['soft','Medium','24px corners, so it reads like a card.'],['tight','Tight','14px corners. More precise.']]},
 {k:'body',name:'Body',opts:[['ink','Black','Pure black. Blends into the camera hole.'],['hairline','Black + outline','A faint outline so you can find its edge on dark screens.'],['tint','Tinted','Black with a slight wash of the activity colour.']]},
 {k:'type',name:'Typeface',opts:[['technical','Geist','Geist for text, Geist Mono for numbers. Neutral and precise.'],['rounded','Figtree','Softer and friendlier.'],['mono','Martian Mono','Monospace for everything. Feels like an instrument.']]},
 {k:'motion',name:'Motion',opts:[['snappy','Snappy','Fast, settles with no wobble.'],['bouncy','Springy','A small overshoot.'],['liquid','Slow','Heavy and soft.']]},
 {k:'rest',name:'At rest',opts:[['dense','Two facts','Value on one side of the camera, label on the other.'],['glance','One fact','Shorter pill, one value at a time.'],['minimal','Ring only','Just a thin ring around the camera.']]},
];
const PRESETS=[
 ['Signal',{pal:'signal',rim:'ticks',shape:'round',body:'ink',type:'technical',motion:'snappy',rest:'dense'}],
 ['Quiet',{pal:'mono',rim:'line',shape:'round',body:'hairline',type:'technical',motion:'snappy',rest:'minimal'}],
 ['Coded',{pal:'coded',rim:'line',shape:'soft',body:'ink',type:'technical',motion:'bouncy',rest:'dense'}],
 ['Instrument',{pal:'signal',rim:'ticks',shape:'tight',body:'ink',type:'mono',motion:'snappy',rest:'glance'}],
 ['Clay',{pal:'clay',rim:'fill',shape:'round',body:'tint',type:'rounded',motion:'liquid',rest:'glance'}],
];
const THEMES=[
 ['signal','Signal','Black and off-white. Orange shows up only for things that need you now, like calls and alarms. Progress is shown as tick marks around the edge.',{pal:'signal',rim:'ticks',shape:'round',body:'ink',type:'technical',motion:'snappy',rest:'dense'}],
 ['quiet','Quiet','The calmest one. No colour at all, a faint outline, and just a ring around the camera when nothing is happening.',{pal:'mono',rim:'line',shape:'round',body:'hairline',type:'technical',motion:'snappy',rest:'minimal'}],
 ['coded','Coded','Each activity has a muted colour of its own (music, timer, maps, calls), traced by a thin line around the edge.',{pal:'coded',rim:'line',shape:'soft',body:'ink',type:'technical',motion:'bouncy',rest:'dense'}],
 ['instrument','Instrument','Monospace type everywhere, tight corners and tick marks. Reads like a dashboard gauge.',{pal:'signal',rim:'ticks',shape:'tight',body:'ink',type:'mono',motion:'snappy',rest:'glance'}],
 ['clay','Clay','Soft earth tones, rounded type and slow movement. The background fills with colour instead of a line.',{pal:'clay',rim:'fill',shape:'round',body:'tint',type:'rounded',motion:'liquid',rest:'glance'}],
];
const CTX=[['light','Light app'],['dark','Dark app'],['home','Home screen']];
let T=THEMES[0], P={...T[3]}, ctx='light';

/* ---------- data ---------- */
const D={timer:{left:168,total:180},music:{pos:72,len:208},nav:{p:.62},charge:{p:.86}};
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const PROG={music:()=>D.music.pos/D.music.len,timer:()=>D.timer.left/D.timer.total,nav:()=>D.nav.p,charge:()=>D.charge.p,full:()=>1};
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
const wave=(n=6)=>`<div class="wave">${Array.from({length:n},()=>`<i style="animation-duration:${(.5+rnd()*.6).toFixed(2)}s;animation-delay:-${rnd().toFixed(2)}s"></i>`).join('')}</div>`;
const tick=items=>`<div class="tkw"><div class="tk">${items.map(x=>`<span>${x}</span>`).join('')}</div></div>`;

/* ---------- screen content ---------- */
const sbarHTML=`<span>14:07</span><span class="ico">
 <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="9" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".35"/></svg>
 <svg width="16" height="12" viewBox="0 0 24 18"><path d="M2 6a15 15 0 0 1 20 0M5.5 9.5a10 10 0 0 1 13 0M9 13a5 5 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="16" r="1.6" fill="currentColor"/></svg>
 <svg width="24" height="12" viewBox="0 0 24 12"><rect x=".6" y=".6" width="20" height="10.8" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2.2" y="2.2" width="14.5" height="7.6" rx="1.6" fill="currentColor"/><rect x="21.6" y="4" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".45"/></svg></span>`;
const MSGS=[['JL','Jules','Are we still on for 7? I booked the table.','13:58'],['MR','Maya Rao','Sent the deck, have a look when you can','13:20'],['HB','HDFC Bank','Your November statement is ready','11:02'],['D','Dad','Call me when free','Yesterday'],['RK','Rohan','haha yes, same time next week','Yesterday'],['AS','Ananya','Can you send the photos from Sunday?','Tue']];
const appHTML=`<div class="app-h"><b>Messages</b><span>Edit</span></div><div class="srch">Search</div>${MSGS.map(m=>`<div class="msg"><span class="a">${m[0]}</span><div style="min-width:0"><b>${m[1]}</b><p>${m[2]}</p></div><time>${m[3]}</time></div>`).join('')}
 <div class="home"><div class="day">Friday 20 November</div><div class="big">14:07</div><div class="grid4">${'<i></i>'.repeat(8)}</div></div>`;

/* ---------- views ---------- */
const BIGR={round:36,soft:24,tight:14};
function views(){
  const restDense={w:178,h:32,aura:'var(--c-neutral)',p:null,html:`<div class="v split"><div>${tick([ic('cal',13)+'<span class="num">23m</span>',ic('batt',14)+'<span class="num">86%</span>',ic('cloud',14)+'<span class="num">18°</span>'])}</div><div>${tick(['<span class="mut">Standup</span>','<span class="mut">6h 10m</span>','<span class="mut">Drizzle</span>'])}</div></div>`};
  const rest=P.rest==='minimal'?{w:40,h:32,aura:'var(--c-neutral)',p:'full',html:''}
    :P.rest==='glance'?{w:136,h:32,aura:'var(--c-neutral)',p:null,html:`<div class="v split" style="gap:22px"><div>${tick([ic('cal',13)+'<span class="num">23m</span>',ic('batt',14)+'<span class="num">86%</span>',ic('cloud',14)+'<span class="num">18°</span>'])}</div><div></div></div>`}
    :restDense;
  return {
   rest,
   music:{w:206,h:32,aura:'var(--c-music)',p:'music',html:`<div class="v split"><div><span class="art"></span><span class="num mut" data-t="mpos">1:12</span></div><div>${wave(6)}</div></div>`},
   musicX:{w:320,h:184,big:1,aura:'var(--c-music)',p:'music',html:`<div class="v"><div class="cambar"><span>Now playing</span><span>${ic('bt',11)} Buds</span></div>
     <div class="pad"><div class="row"><span class="art lg"></span><div class="meta"><b>Midnight Static</b><small>Lowtide Club</small></div><span class="ib">${ic('heart',18)}</span></div>
     <div class="scrub"><i data-scrub></i></div><div class="times"><span data-t="mpos">1:12</span><span>3:28</span></div>
     <div class="ctrls"><span class="ib"></span><span class="ib">${ic('prev',20)}</span><span class="ib big">${ic('pause',20)}</span><span class="ib">${ic('next',20)}</span><span class="ib"></span></div></div></div>`},
   timer:{w:180,h:32,aura:'var(--c-timer)',p:'timer',html:`<div class="v split"><div style="color:var(--c-timer)">${ic('hourglass',14)}<span style="color:#EEECE7">Steep</span></div><div><span class="num" style="color:var(--c-timer)" data-t="timer">2:48</span></div></div>`},
   nav:{w:206,h:32,aura:'var(--c-nav)',p:'nav',html:`<div class="v split"><div style="color:var(--c-nav)">${ic('turn',15)}<span class="num" style="color:#EEECE7">200 m</span></div><div><span class="num mut">14:32</span></div></div>`},
   call:{w:320,h:100,big:1,aura:'var(--c-call)',p:'full',html:`<div class="v"><div class="cambar"><span>Incoming call</span><span>mobile</span></div>
     <div class="pad" style="padding-top:0"><div class="row"><span class="av">MR</span><div class="meta"><b>Maya Rao</b><small>Last call yesterday</small></div>
     <span class="cbtn no">${ic('phone',18)}</span><span class="cbtn yes">${ic('phone',18)}</span></div></div></div>`},
   charge:{w:212,h:52,big:1,mid:1,aura:'var(--c-call)',p:'charge',html:`<div class="v chg"><div style="color:var(--aura);gap:6px;display:flex;align-items:center">${ic('bolt',16)}<span class="pct">86%</span></div><div style="text-align:right;line-height:1.25"><span class="mut" style="font-size:11.5px">full in</span><br><span class="num">38 min</span></div></div>`},
  };
}
const radius=v=>v.mid?Math.min(26,BIGR[P.shape]):v.big?BIGR[P.shape]:(P.shape==='tight'?10:16);

/* ---------- rim ---------- */
let uid=0;
function rimPath(w,h,r){const x0=.75,y0=.75,x1=w-.75,y1=h-.75,rr=Math.max(0,Math.min(r-.75,(h-1.5)/2,(w-1.5)/2));
 return `M${w/2} ${y0}H${x1-rr}A${rr} ${rr} 0 0 1 ${x1} ${y0+rr}V${y1-rr}A${rr} ${rr} 0 0 1 ${x1-rr} ${y1}H${x0+rr}A${rr} ${rr} 0 0 1 ${x0} ${y1-rr}V${y0+rr}A${rr} ${rr} 0 0 1 ${x0+rr} ${y0}Z`;}
const islInner=html=>{const id='m'+(uid++);return `<div class="vw"><div class="fillbar"></div>${html}<div class="ubar"><i></i></div></div><svg class="rim"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-20" y="-20" width="420" height="260"><path class="mk" pathLength="100"/></mask></defs><path class="g" pathLength="100"/><path class="t0" pathLength="100"/><path class="t1" pathLength="100" mask="url(#${id})"/></svg>`;};
function setRim(isl,w,h,r,p){
  const svg=isl.querySelector('.rim'); svg.setAttribute('width',w); svg.setAttribute('height',h);
  const d=rimPath(w,h,r); svg.querySelectorAll('path').forEach(e=>e.setAttribute('d',d));
  const pc=p==null?0:p*100;
  svg.querySelector('.g').style.strokeDasharray=`${pc.toFixed(2)} 200`;
  svg.querySelector('.mk').style.strokeDasharray=`${pc.toFixed(2)} 200`;
  svg.querySelector('.t0').style.display=(p==null&&P.rim==='ticks')?'none':'';
  isl.querySelector('.fillbar').style.width=pc+'%';
  const ub=isl.querySelector('.ubar'); ub.style.visibility=(p==null||h>60&&false)?'hidden':''; ub.firstElementChild.style.width=pc+'%';
}

/* ---------- fit to width ---------- */
function fit(el){ const inner=el.firstElementChild, W=+el.dataset.w, s=Math.min(1,el.clientWidth/W);
  inner.style.transform=`scale(${s})`; el.style.height=(inner.offsetHeight*s)+'px'; }
const ro=new ResizeObserver(es=>es.forEach(e=>fit(e.target)));

/* ---------- sheet ---------- */
const SHEET=[['rest','At rest','Always on screen. Shows what\'s next.'],['music','Music','Compact, around the camera.'],['timer','Timer','Counts down on the island.'],['nav','Navigation','Next turn and arrival time.'],['charge','Charging','Appears briefly when you plug in.'],['call','Incoming call','Grows over the status bar.'],['musicX','Music, open','Swipe down on the island to open it.']];
function renderSheet(){
  const V=views();
  document.getElementById('sheet').innerHTML=SHEET.map(([k,l,d])=>{const v=V[k],r=radius(v),H=Math.max(150,v.h+110);
    return `<figure class="tile"><div class="fit" data-w="408"><div class="crop"><div class="scr ctx-${ctx}" style="height:${H}px"><div class="sbar">${sbarHTML}</div><div class="app">${appHTML}</div>
      <div class="isl" data-k="${k}" style="width:${v.w}px;height:${v.h}px;border-radius:${r}px;--aura:${v.aura}">${islInner(v.html)}</div><div class="cam"></div></div></div></div>
      <figcaption><b>${l}</b><span>${d}</span></figcaption></figure>`;}).join('');
  document.querySelectorAll('#sheet .isl').forEach(e=>{const v=V[e.dataset.k];setRim(e,v.w,v.h,radius(v),v.p?PROG[v.p]():null)});
  document.querySelectorAll('#sheet .fit').forEach(f=>{fit(f);ro.observe(f)});
}

/* ---------- live phone ---------- */
const liveScr=document.getElementById('liveScr'), hi=document.getElementById('hi');
liveScr.querySelector('.sbar').innerHTML=sbarHTML; liveScr.querySelector('.app').innerHTML=appHTML;
class Spring{constructor(v){this.v=v;this.t=v;this.vel=0}step(dt,k,d){if(reduce){this.v=this.t;return}const f=-k*(this.v-this.t)-d*this.vel;this.vel+=f*dt;this.v+=this.vel*dt}}
const SP={snappy:[520,46],bouncy:[260,19],liquid:[80,18]};
const S={w:new Spring(184),h:new Spring(32),r:new Spring(16)};
let cur='rest',LV={};
function buildLive(){ LV=views();
  hi.innerHTML=`<div class="isl" id="lisl">${islInner(Object.entries(LV).map(([k,v])=>`<div class="view" data-v="${k}" style="width:${v.w}px;height:${v.h}px">${v.html}</div>`).join(''))}</div>`;
  showLive(cur,true); }
function showLive(k,instant){ cur=k; const v=LV[k], isl=document.getElementById('lisl');
  isl.style.setProperty('--aura',v.aura); isl.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.dataset.v===k));
  S.w.t=v.w;S.h.t=v.h;S.r.t=radius(v); if(instant)Object.values(S).forEach(s=>{s.v=s.t;s.vel=0});
  document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===k))); }
let last=performance.now();
function frame(now){ const dt=Math.min(.032,(now-last)/1000);last=now;const [k,d]=SP[P.motion];
  for(let i=0;i<3;i++)Object.values(S).forEach(s=>s.step(dt/3,k,d));
  const isl=document.getElementById('lisl');
  if(isl){const w=Math.max(24,S.w.v),h=Math.max(24,S.h.v),r=Math.max(4,Math.min(S.r.v,h/2));
    Object.assign(isl.style,{left:(-w/2)+'px',width:w+'px',height:h+'px',borderRadius:r+'px'});
    const v=LV[cur]; setRim(isl,w,h,r,v.p?PROG[v.p]():null);}
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);
const SEQ=[['rest',2600],['music',1800],['musicX',3000],['music',1200],['timer',2200],['nav',2200],['call',2600],['charge',2200]];
let si=0,seqT,auto=true;
function runSeq(){clearTimeout(seqT);if(!auto)return;const [k,ms]=SEQ[si%SEQ.length];showLive(k);si++;seqT=setTimeout(runSeq,ms);}

/* ---------- controls ---------- */
document.getElementById('tabs').innerHTML=THEMES.map(t=>`<button type="button" class="tab" data-theme-k="${t[0]}">${t[1]}</button>`).join('');
document.getElementById('ctxopts').innerHTML=CTX.map(([k,l])=>`<button type="button" class="opt" data-ctx="${k}" aria-pressed="false">${l}</button>`).join('');
const STL=[['rest','At rest'],['music','Music'],['musicX','Music, open'],['timer','Timer'],['nav','Navigation'],['call','Incoming call'],['charge','Charging']];
document.getElementById('states').innerHTML=`<button type="button" class="opt" data-auto aria-pressed="true">Play through all <small>auto</small></button>`+STL.map(([k,l])=>`<button type="button" class="opt" data-state="${k}" aria-pressed="false">${l}</button>`).join('');

function apply(rebuild=true){
  AX.forEach(a=>{root.dataset[a.k]=P[a.k];});
  liveScr.className='scr ctx-'+ctx;
  document.querySelectorAll('[data-ctx]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ctx===ctx)));
  document.querySelectorAll('[data-theme-k]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.themeK===T[0])));
  document.getElementById('tName').textContent=T[1];
  document.getElementById('tDesc').textContent=T[2];
  document.getElementById('tSpec').innerHTML=AX.map(a=>`<span>${a.name}: <b>${a.opts.find(o=>o[0]===P[a.k])[1]}</b></span>`).join('');
  if(rebuild){renderSheet();buildLive();}
  tickUI();
}
function pickTheme(k){ const t=THEMES.find(x=>x[0]===k); if(!t) return; T=t; P={...t[3]}; apply(); si=0; if(auto) runSeq(); }
window.addEventListener('hashchange',()=>pickTheme(location.hash.slice(1)));
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-theme-k]');if(t){ try{history.replaceState(null,'','#'+t.dataset.themeK)}catch(err){} pickTheme(t.dataset.themeK);return;}
  const c=e.target.closest('[data-ctx]');if(c){ctx=c.dataset.ctx;apply(true);return;}
  const st=e.target.closest('[data-state]');if(st){auto=false;clearTimeout(seqT);document.querySelector('[data-auto]').setAttribute('aria-pressed','false');showLive(st.dataset.state);return;}
  if(e.target.closest('[data-auto]')){auto=true;document.querySelector('[data-auto]').setAttribute('aria-pressed','true');si=0;runSeq();}
});

/* ---------- clock ---------- */
function tickUI(){
  document.querySelectorAll('[data-t="timer"]').forEach(e=>e.textContent=fmt(D.timer.left));
  document.querySelectorAll('[data-t="mpos"]').forEach(e=>e.textContent=fmt(D.music.pos));
  document.querySelectorAll('[data-scrub]').forEach(e=>e.style.width=(D.music.pos/D.music.len*100)+'%');
  const V=views();
  document.querySelectorAll('#sheet .isl').forEach(e=>{const v=V[e.dataset.k];setRim(e,v.w,v.h,radius(v),v.p?PROG[v.p]():null)});
}
setInterval(()=>{D.timer.left=D.timer.left<=0?D.timer.total:D.timer.left-1;D.music.pos=(D.music.pos+1)%D.music.len;D.nav.p=D.nav.p>=.99?.2:D.nav.p+.004;tickUI();},1000);
let ti=0;setInterval(()=>{ti=(ti+1)%3;root.style.setProperty('--ti',ti)},3400);

const fl=document.getElementById('fitLive'); fit(fl); ro.observe(fl);
{const h=location.hash.slice(1); const t=THEMES.find(x=>x[0]===h); if(t){T=t;P={...t[3]};}}
apply(); runSeq();
})();
</script>
